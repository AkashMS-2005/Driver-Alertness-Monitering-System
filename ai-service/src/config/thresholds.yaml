# SmartDrive Guardian — AI Detection Thresholds
# These are internal tuning parameters. None of these values are ever sent to the frontend.
# Phase 2: Drowsiness detection only.

eye_state:
  # Eye Aspect Ratio (EAR) thresholds
  ear_threshold: 0.20          # Below this = eyes closed
  blink_duration_ms: 300       # Normal blink duration
  prolonged_closure_ms: 1500   # Eyes closed this long = drowsy signal

drowsiness:
  # Temporal thresholds (seconds of continuous eye closure)
  drowsy_time: 1.5             # eyes closed > 1.5s → DROWSY
  microsleep_time: 3.0         # eyes closed > 3.0s → MICROSLEEP
  # PERCLOS
  perclos_window_seconds: 60   # Rolling window for PERCLOS calculation
  perclos_warning: 30.0        # PERCLOS above this = fatigue warning

mouth_state:
  # Mouth Aspect Ratio (MAR) — yawn detection
  # Old behaviour: yawning = MAR > mar_threshold (single frame, caused false positives from talking)
  # New behaviour: temporal state machine — mouth must remain above mar_threshold for
  # yawn_min_duration seconds continuously before a yawn is confirmed.
  mar_threshold: 0.80          # Above this = candidate for yawning
  yawn_min_duration: 1.0       # seconds mouth must stay above threshold to confirm a yawn
  yawn_reset_duration: 0.3     # seconds mouth must stay closed to end the current yawn episode
  #
  # Tuning guidance:
  #   If normal talking still triggers yawning, increase yawn_min_duration (try 1.2 – 1.5).
  #   If genuine yawns are missed, decrease yawn_min_duration (try 0.8 – 0.9).
  #   If the yawn "flickers" at end, increase yawn_reset_duration (try 0.5).
  #   If a new yawn is counted too quickly after a previous one, increase yawn_reset_duration.
